{
  "name": "OpenPlans CI",
  "on": {
    "push": {
      "branches": [
        "**"
      ]
    },
    "pull_request": null,
    "workflow_dispatch": null
  },
  "permissions": {
    "contents": "read"
  },
  "defaults": {
    "run": {
      "shell": "bash"
    }
  },
  "jobs": {
    "dedupe": {
      "name": "OpenPlans / same-commit check",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 60,
      "permissions": {
        "actions": "read",
        "contents": "read"
      },
      "outputs": {
        "full": "${{ steps.decide.outputs.full }}",
        "source_run": "${{ steps.decide.outputs.source_run }}"
      },
      "steps": [
        {
          "uses": "actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5",
          "with": {
            "persist-credentials": false
          }
        },
        {
          "uses": "actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020",
          "with": {
            "node-version-file": ".node-version"
          }
        },
        {
          "id": "decide",
          "name": "Find a passing run of this commit",
          "env": {
            "GH_TOKEN": "${{ github.token }}"
          },
          "run": "node .github/check-required.mjs same-commit"
        }
      ]
    },
    "linux": {
      "name": "OpenPlans / Linux",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 45,
      "needs": [
        "dedupe"
      ],
      "if": "${{ needs.dedupe.outputs.full == 'true' }}",
      "steps": [
        {
          "uses": "actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5",
          "with": {
            "persist-credentials": false
          }
        },
        {
          "uses": "actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020",
          "with": {
            "node-version-file": ".node-version"
          }
        },
        {
          "name": "Check runner limits",
          "run": "node .github/runner-limits.mjs check linux"
        },
        {
          "name": "Install Poppler",
          "run": "sudo apt-get update\nsudo apt-get install --yes --no-install-recommends poppler-utils\npdftotext -v"
        },
        {
          "name": "Pin npm",
          "run": "npm install --global \"npm@$(cat .github/npm-version)\" --no-audit --no-fund"
        },
        {
          "name": "Verify toolchain",
          "run": "test \"$(node --version)\" = \"v$(cat .node-version)\"\ntest \"$(npm --version)\" = \"$(cat .github/npm-version)\""
        },
        {
          "name": "Clean locked install",
          "run": "npm ci --no-audit --no-fund"
        },
        {
          "name": "Offline project checks",
          "run": "scripts/ci.sh",
          "env": {
            "npm_config_offline": "true"
          }
        }
      ],
      "env": {
        "OPENPLANS_REQUIRE_POPPLER": "1"
      }
    },
    "macos-shard": {
      "name": "OpenPlans / macOS shard ${{ matrix.shard }}",
      "runs-on": "macos-15-intel",
      "timeout-minutes": 45,
      "needs": [
        "dedupe"
      ],
      "if": "${{ needs.dedupe.outputs.full == 'true' }}",
      "strategy": {
        "fail-fast": false,
        "matrix": {
          "shard": [
            1,
            2,
            3
          ]
        }
      },
      "steps": [
        {
          "uses": "actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5",
          "with": {
            "persist-credentials": false
          }
        },
        {
          "uses": "actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020",
          "with": {
            "node-version-file": ".node-version"
          }
        },
        {
          "name": "Check runner limits",
          "run": "node .github/runner-limits.mjs check macos"
        },
        {
          "name": "Install Poppler",
          "env": {
            "HOMEBREW_NO_AUTO_UPDATE": "1",
            "HOMEBREW_NO_INSTALL_CLEANUP": "1"
          },
          "run": "brew install poppler\npdftotext -v"
        },
        {
          "name": "Pin npm",
          "run": "npm install --global \"npm@$(cat .github/npm-version)\" --no-audit --no-fund"
        },
        {
          "name": "Verify toolchain",
          "run": "test \"$(node --version)\" = \"v$(cat .node-version)\"\ntest \"$(npm --version)\" = \"$(cat .github/npm-version)\""
        },
        {
          "name": "Clean locked install",
          "run": "npm ci --no-audit --no-fund"
        },
        {
          "name": "Offline project checks",
          "run": "scripts/ci.sh",
          "env": {
            "npm_config_offline": "true",
            "OPENPLANS_CI_SHARD": "${{ matrix.shard }}/${{ strategy.job-total }}"
          }
        }
      ],
      "env": {
        "OPENPLANS_REQUIRE_POPPLER": "1"
      }
    },
    "macos": {
      "name": "OpenPlans / macOS",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 5,
      "if": "${{ always() && needs.dedupe.outputs.full == 'true' }}",
      "needs": [
        "dedupe",
        "macos-shard"
      ],
      "steps": [
        {
          "uses": "actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5",
          "with": {
            "persist-credentials": false
          }
        },
        {
          "uses": "actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020",
          "with": {
            "node-version-file": ".node-version"
          }
        },
        {
          "name": "Classify macOS shard result",
          "env": {
            "NEEDS_RESULTS": "${{ toJSON(needs) }}"
          },
          "run": "node .github/check-required.mjs macos"
        }
      ]
    },
    "docker": {
      "name": "OpenPlans / Docker Linux",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 20,
      "needs": [
        "dedupe"
      ],
      "if": "${{ needs.dedupe.outputs.full == 'true' }}",
      "steps": [
        {
          "uses": "actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5",
          "with": {
            "persist-credentials": false
          }
        },
        {
          "name": "Build candidate image",
          "run": "docker build --pull --tag openplans-ci:${{ github.sha }} ."
        },
        {
          "name": "Check compiled entry point",
          "run": "docker run --rm --network none openplans-ci:${{ github.sha }} node --check dist/api/server.js"
        },
        {
          "name": "Show the usage report state with no network",
          "run": "docker run --rm --network none -e OPENPLANS_PUBLIC_QUOTING=off -e OPENPLANS_PUBLIC_HOUSEHOLD=off -e OPENPLANS_PUBLIC_COMPAT=off openplans-ci:${{ github.sha }} worker usage-report show > usage-report-show.txt 2>&1\ngrep -qx 'state: off' usage-report-show.txt\nif grep -q 'usage_report.failed' usage-report-show.txt; then exit 1; fi\nrm -f usage-report-show.txt"
        },
        {
          "name": "Remove candidate image",
          "if": "${{ always() }}",
          "run": "if docker image inspect openplans-ci:${{ github.sha }} >/dev/null 2>&1; then\n  docker image rm openplans-ci:${{ github.sha }}\nfi"
        }
      ]
    },
    "postgis": {
      "name": "OpenPlans / PostGIS",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 20,
      "needs": [
        "dedupe"
      ],
      "if": "${{ needs.dedupe.outputs.full == 'true' }}",
      "steps": [
        {
          "uses": "actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5",
          "with": {
            "persist-credentials": false
          }
        },
        {
          "uses": "actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020",
          "with": {
            "node-version-file": ".node-version"
          }
        },
        {
          "name": "Pin npm",
          "run": "npm install --global \"npm@$(cat .github/npm-version)\" --no-audit --no-fund"
        },
        {
          "name": "Verify toolchain",
          "run": "test \"$(node --version)\" = \"v$(cat .node-version)\"\ntest \"$(npm --version)\" = \"$(cat .github/npm-version)\""
        },
        {
          "name": "Clean locked install",
          "run": "npm ci --no-audit --no-fund"
        },
        {
          "name": "Build plugins",
          "run": "npm run build:plugins",
          "env": {
            "npm_config_offline": "true"
          }
        },
        {
          "name": "Build database image",
          "run": "docker build --pull --tag openplans-postgis-ci:${{ github.sha }} --file Dockerfile.db ."
        },
        {
          "name": "PostGIS suites",
          "run": "scripts/postgis-tests.sh --image openplans-postgis-ci:${{ github.sha }}",
          "env": {
            "npm_config_offline": "true"
          }
        },
        {
          "name": "Remove database image",
          "if": "${{ always() }}",
          "run": "if docker image inspect openplans-postgis-ci:${{ github.sha }} >/dev/null 2>&1; then\n  docker image rm openplans-postgis-ci:${{ github.sha }}\nfi"
        }
      ]
    },
    "required": {
      "name": "OpenPlans / required",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 5,
      "if": "${{ always() }}",
      "needs": [
        "dedupe",
        "linux",
        "docker",
        "postgis",
        "macos"
      ],
      "steps": [
        {
          "uses": "actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5",
          "with": {
            "persist-credentials": false
          }
        },
        {
          "uses": "actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020",
          "with": {
            "node-version-file": ".node-version"
          }
        },
        {
          "name": "Check required and advisory job results",
          "env": {
            "NEEDS_RESULTS": "${{ toJSON(needs) }}"
          },
          "run": "node .github/check-required.mjs"
        }
      ]
    }
  }
}
