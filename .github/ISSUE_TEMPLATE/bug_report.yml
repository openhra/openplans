name: Bug report
description: Report a problem with the API, MCP server, CLI or deployment.
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        Issues are public. Do not include personal health information, household details,
        credentials or contact addresses. Remove them from commands, logs and screenshots.
        Report security problems through [the security policy](https://github.com/openhra/openplans/blob/main/SECURITY.md).
  - type: dropdown
    id: deployment
    attributes:
      label: Where did this happen?
      options:
        - Self-hosted OpenPlans
        - Hosted OpenPlans
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: OpenPlans version
      description: Copy the version from /healthz if provided, or the MCP initialize response's serverInfo. Otherwise, give the release or commit you deployed, or say unknown.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: What did you run?
      description: Give the steps and a minimal command, HTTP request or MCP tool call. Remove credentials and personal data.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened instead?
      description: Include the error and relevant output after removing private data.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: For self-hosting, include the operating system, Node.js or container version and deployment method. For hosted use, name the endpoint or client.
  - type: checkboxes
    id: privacy
    attributes:
      label: Before submitting
      options:
        - label: I removed personal health information, household details, credentials and contact addresses.
          required: true
