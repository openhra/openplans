name: openplans-local

services:
  db:
    shm_size: 256m
    image: openplans-db:local
    build:
      context: .
      dockerfile: Dockerfile.db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      OPENPLANS_DB_MEMORY: ${OPENPLANS_DB_MEMORY:-1g}
    command:
      - sh
      - -ec
      - |
        # BEGIN MEMORY PROFILE
        #!/bin/sh
        set -eu
        # Budget in whole MiB/GiB, not total host RAM. Fail closed on invalid configuration.
        budget=$${OPENPLANS_DB_MEMORY:-1g}
        case "$$budget" in
          *[gG]) amount=$${budget%?}; unit=1024 ;;
          *[mM]) amount=$${budget%?}; unit=1 ;;
          *) echo 'OPENPLANS_DB_MEMORY requires a whole m/g value (512m..256g)' >&2; exit 1 ;;
        esac
        case "$$amount" in ''|*[!0-9]*|0*) echo 'Invalid OPENPLANS_DB_MEMORY amount' >&2; exit 1 ;; esac
        [ "$${#amount}" -le 6 ] || exit 1
        memory=$$((amount * unit))
        [ "$$memory" -ge 512 ] && [ "$$memory" -le 262144 ] || { echo 'OPENPLANS_DB_MEMORY outside 512m..256g' >&2; exit 1; }
        connections=$$((memory / 32))
        [ "$$connections" -ge 20 ] || connections=20
        [ "$$connections" -le 100 ] || connections=100
        work=$$((memory / (connections * 16)))
        [ "$$work" -ge 1 ] || work=1
        [ "$$work" -le 32 ] || work=32
        maintenance=$$((memory / 10))
        [ "$$maintenance" -le 1024 ] || maintenance=1024
        exec docker-entrypoint.sh postgres \
          -c "shared_buffers=$$((memory / 4))MB" \
          -c "effective_cache_size=$$((memory * 70 / 100))MB" \
          -c "work_mem=$${work}MB" \
          -c "maintenance_work_mem=$${maintenance}MB" \
          -c "autovacuum_work_mem=$${maintenance}MB" \
          -c "max_connections=$$connections" \
          -c "max_parallel_workers_per_gather=2"
        # END MEMORY PROFILE
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'pg_isready -h 127.0.0.1 -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"',
        ]
      interval: 2s
      timeout: 5s
      retries: 30

  api:
    image: ${OPENPLANS_IMAGE:-openplans:local}
    build:
      context: .
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      PORT: "3000"
      HOST: "0.0.0.0"
      OPENPLANS_MCP: ${OPENPLANS_MCP:-on}
      OPENPLANS_MCP_TOKEN: ${OPENPLANS_MCP_TOKEN:-}
      OPENPLANS_MCP_ALLOW_PERSONALIZED: ${OPENPLANS_MCP_ALLOW_PERSONALIZED:-}
      OPENPLANS_MCP_CURSOR_SECRET: ${OPENPLANS_MCP_CURSOR_SECRET:-}
      OPENPLANS_MCP_ALLOWED_HOSTS: ${OPENPLANS_MCP_ALLOWED_HOSTS:-}
      OPENPLANS_MCP_ALLOWED_ORIGINS: ${OPENPLANS_MCP_ALLOWED_ORIGINS:-}
      OPENPLANS_TRUST_PROXY: ${OPENPLANS_TRUST_PROXY:-}
      OPENPLANS_API_TOKEN: ${OPENPLANS_API_TOKEN:-}
      OPENPLANS_PUBLIC_QUOTING: ${OPENPLANS_PUBLIC_QUOTING:-on}
      OPENPLANS_PUBLIC_HOUSEHOLD: ${OPENPLANS_PUBLIC_HOUSEHOLD:-on}
      OPENPLANS_PUBLIC_COMPAT: ${OPENPLANS_PUBLIC_COMPAT:-on}
      OPENPLANS_COMPAT_API_KEY: ${OPENPLANS_COMPAT_API_KEY:-}
      OPENPLANS_COMPAT_KEY_HEADER: ${OPENPLANS_COMPAT_KEY_HEADER:-}
      OPENPLANS_API_CACHE: ${OPENPLANS_API_CACHE:-on}
      OPENPLANS_API_CACHE_MB: ${OPENPLANS_API_CACHE_MB:-64}
      OPENPLANS_CACHE_URL: ${OPENPLANS_CACHE_URL:-}
    command: ["sh", "-c", "worker migrate && exec node dist/api/server.js"]
    ports:
      - "127.0.0.1:${API_PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/healthz').then(async r => { const b = await r.json(); if (!r.ok || b.db !== 'ok') process.exit(1); }).catch(() => process.exit(1))",
        ]
      interval: 2s
      timeout: 5s
      retries: 30

  cache:
    image: valkey/valkey:8.1-alpine
    profiles: ["cache"]
    tmpfs: ["/data"]
    command:
      [
        "valkey-server",
        "--maxmemory",
        "${OPENPLANS_CACHE_MEMORY:-256mb}",
        "--maxmemory-policy",
        "allkeys-lru",
        "--save",
        "",
        "--appendonly",
        "no",
        "--protected-mode",
        "no",
      ]
    # No host port or persistent volume: reachable only on the project network.
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 15

  worker:
    image: ${OPENPLANS_IMAGE:-openplans:local}
    build:
      context: .
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      OPENPLANS_DATA_DIR: /data
      # Optional operator manifest, e.g. /data/work/access/operator.json; layered over the shipped ones.
      OPENPLANS_ACCESS_MANIFEST: ${OPENPLANS_ACCESS_MANIFEST:-}
      # Optional ISO country code recorded in admission receipts; it does not restrict collection.
      OPENPLANS_EGRESS_COUNTRY: ${OPENPLANS_EGRESS_COUNTRY:-}
    volumes:
      - type: bind
        source: ${OPENPLANS_DATA_DIR:-/var/lib/openplans}/raw
        target: /data/raw
        read_only: ${OPENPLANS_RAW_READ_ONLY:-true}
        bind:
          create_host_path: false
      - type: bind
        source: ${OPENPLANS_DATA_DIR:-/var/lib/openplans}/reports
        target: /data/reports
        bind:
          create_host_path: false
      - type: bind
        source: ${OPENPLANS_DATA_DIR:-/var/lib/openplans}/work
        target: /data/work
        bind:
          create_host_path: false
    entrypoint: ["worker"]
    command: ["status"]
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
